services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    # SQL Server has no arm64 image for this tag; on Apple Silicon it runs under emulation
    # (Docker Desktop: enable "Use Rosetta for x86_64/amd64 emulation").
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - depotflow-sql:/var/opt/mssql
    healthcheck:
      # A trivial query: the container counts as healthy only once SQL Server really answers.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/DepotFlow.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=db,1433;Database=${DEPOTFLOW_DB:-DepotFlow};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
      Seed__DefaultPassword: ${SEED_DEFAULT_PASSWORD}
      Seed__DemoTariffs: "true"            # demo tariffs for every shipping line, so the journey works at once
      Database__MigrateOnStartup: "true"   # apply migrations and seed users and the yard when the API starts
      Swagger__Enabled: "true"             # Swagger UI at /swagger on the API port
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__IncludeScopes: "true"   # puts the trace id on every log line
    ports:
      - "5080:8080"

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "8080:8080"   # the Angular app; nginx proxies /api to the api service

volumes:
  depotflow-sql:
