services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server has no arm64 image for this tag; on Apple Silicon it runs under emulation
    # (Docker Desktop: enable "Use Rosetta for x86_64/amd64 emulation").
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - depotflow-sql:/var/opt/mssql

volumes:
  depotflow-sql:
