name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -warnaserror

      # The integration tests start SQL Server in a container (Testcontainers); GitHub's runners have Docker.
      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=normal"

  web:
    name: Build and test (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # No lint step: ESLint is not configured for this project (the TypeScript compiler runs in strict mode).
      - name: Build
        run: npm run build

      # The unit tests run on Vitest with jsdom, so no browser is needed.
      - name: Test
        run: npm test -- --watch=false

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The compose file needs these variables to be defined; the example values are the demo placeholders.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build the api and web images
        run: docker compose build api web
